[project]
name = "bussola"
version = "0.1.0"
description = "Work profiling assistant - backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
    # English NER model for the PII redactor/guardrails (MIT). Pinned as a real
    # dependency so `uv sync` installs it and never prunes it — it's required by
    # the kiosk interview (PiiRedactor), not an optional extra. Bump the version
    # together with spaCy. (The Italian side uses pattern recognizers + a blank
    # tokenizer, so no CC-BY-NC it_core_news_lg — §3.)
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "httpx>=0.27,<0.29",
    "psycopg[binary]>=3.1,<4",
    "argon2-cffi>=23.1,<24",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.35",
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "mypy>=1.11",
]
voice = [
    "faster-whisper>=1.0,<2",
    "piper-tts>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

# Pin the lint rule set explicitly to ruff's historical default (E4/E7/E9/F).
# Without this, a bare config's "default" widened across ruff versions (uv
# resolves the latest ruff), flagging patterns the codebase uses on purpose
# (FastAPI `Depends` in defaults, degradation-net `except`). Explicit = the
# gate is deterministic regardless of the installed ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*", "faster_whisper.*", "piper.*"]
ignore_missing_imports = true
